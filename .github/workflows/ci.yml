name: CI — applitag

on:
  push:
    branches: [main, master, "hardening/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build Vite (production + demo)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build — mode production
        run: npm run build:prod
        env:
          VITE_API_BASE_URL: https://applitag-api-production.up.railway.app

      - name: Build — mode demo
        run: npm run build:demo
